<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Thumper</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        width: 280px;
        color: #e8efe4;
        background: #141a14;
      }
      label {
        display: grid;
        gap: 4px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      input,
      button {
        font: inherit;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #3a4535;
        background: #0e130e;
        color: #e8efe4;
      }
      button {
        width: 100%;
        cursor: pointer;
        background: #d97706;
        color: #1a1208;
        font-weight: 650;
        border: none;
      }
      .msg {
        margin-top: 8px;
        font-size: 12px;
        color: #8a9680;
      }
      .hint {
        font-size: 11px;
        color: #8a9680;
        margin: 0 0 10px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 16px; margin: 0 0 8px">Thumper sync</h1>
    <p class="hint">
      Syncs YouTube and SoundCloud when you are signed in. SoundCloud is skipped
      if you are logged out.
    </p>
    <label>
      Thumper origin
      <input id="origin" placeholder="https://thumper.vinaynair.dev" />
    </label>
    <button id="sync">Sync cookies</button>
    <div class="msg" id="msg"></div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
