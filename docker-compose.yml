services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: thumper
      POSTGRES_PASSWORD: thumper
      POSTGRES_DB: thumper
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thumper -d thumper"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://thumper:thumper@postgres:5432/thumper
      DATA_DIR: /data
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
    volumes:
      - userdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3004"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://thumper:thumper@postgres:5432/thumper
      DATA_DIR: /data
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      WORKER_CONCURRENCY: "1"
      YT_DLP_PATH: /opt/venv/bin/yt-dlp
    volumes:
      - userdata:/data
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  userdata:
  caddy_data:
  caddy_config:
